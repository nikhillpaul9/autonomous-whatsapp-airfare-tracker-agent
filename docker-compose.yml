version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flight_tracker_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_URI=postgresql://user:password@db:5432/flight_tracker_db
    depends_on:
      - db
    env_file:
      - .env

  mcp_flights:
    build: 
      context: .
      dockerfile: Dockerfile
    command: python -m mcp_servers.flights_server
    env_file:
      - .env

volumes:
  pgdata:
